# ================================================================
#  TalentPredict — GitLab CI/CD Orchestrator
# ================================================================
#
#  This file defines global settings shared by BOTH pipelines and
#  includes the two independent pipeline definitions from .gitlab/.
#
#  Pipeline architecture:
#    ┌─────────────────────────────────────────────────────────────┐
#    │  .gitlab-ci.yml          (you are here — globals + include) │
#    │   ├── .gitlab/backend-ci.yml    (Spring Boot pipeline)     │
#    │   └── .gitlab/frontend-ci.yml   (Angular pipeline)         │
#    └─────────────────────────────────────────────────────────────┘
#
#  Trigger isolation:
#    • Backend jobs run ONLY when BackEnd/** changes
#    • Frontend jobs run ONLY when FrontEnd/** changes
#
# ================================================================

# ------------------------------------------------------------------
#  Workflow — Skip pipelines for merge-request labels or drafts
# ------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------------
#  Global Variables
# ------------------------------------------------------------------
variables:
  # --- Docker / Registry ----------------------------------------
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

  BACKEND_IMAGE:  "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

  # --- Maven -----------------------------------------------------
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

  # --- Node -------------------------------------------------------
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

  # --- Deployment Ports -------------------------------------------
  #   Backend  → Spring Boot listens on 8081 (per application.properties)
  #   Frontend → Nginx listens on 80 inside the container
  BACKEND_PORT:  "8081"
  FRONTEND_PORT: "80"

# ------------------------------------------------------------------
#  Stages (shared timeline — both pipelines interleave here)
#
#  Stage ordering ensures any backend or frontend job assigned to
#  the same stage name runs in parallel with its counterpart.
# ------------------------------------------------------------------
stages:
  - install       # Frontend: npm ci
  - build         # Backend: mvn compile  |  Frontend: ng build
  - test          # Unit & integration tests
  - quality       # Static analysis, linting, type-checking
  - security      # Dependency vulnerability scanning
  - package       # Docker image build & push to registry
  - deploy        # Environment deployments (dev → staging → prod)

# ------------------------------------------------------------------
#  Default Settings
# ------------------------------------------------------------------
default:
  # Automatic retry on infrastructure failures (not code failures)
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

  # Cancel redundant pipelines when a new commit is pushed
  interruptible: true

# ------------------------------------------------------------------
#  Include the two independent pipeline definitions
# ------------------------------------------------------------------
include:
  - local: ".gitlab/backend-ci.yml"
  - local: ".gitlab/frontend-ci.yml"
