# .gitlab-ci.yml
stages:
  - build
  - test
  - quality
  - security
  - package
  - deploy

# Global variables
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  NODE_VERSION: "20"

# Define cache for Maven and npm
cache:
  paths:
    - .m2/repository/
    - client/node_modules/

# ==================== BACKEND JOBS ====================

backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd serveur
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - serveur/target/
    expire_in: 1 day
  cache:
    paths:
      - .m2/repository/
  only:
    - merge_requests
    - main
    - develop
    - tags

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: talentpredict_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentpredict_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  script:
    - cd serveur
    - mvn test
    - mvn jacoco:report
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    paths:
      - serveur/target/surefire-reports/
      - serveur/target/site/jacoco/
    reports:
      junit: serveur/target/surefire-reports/TEST-*.xml
    expire_in: 30 days
  cache:
    paths:
      - .m2/repository/
  only:
    - merge_requests
    - main
    - develop

backend:sonarqube:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd serveur
    - |
      mvn sonar:sonar \
        -Dsonar.projectKey=talentpredict \
        -Dsonar.sources=src/main \
        -Dsonar.tests=src/test \
        -Dsonar.host.url=$SONARQUBE_URL \
        -Dsonar.login=$SONARQUBE_TOKEN \
        -Dsonar.qualitygate.wait=true
  cache:
    paths:
      - .m2/repository/
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

backend:spotbugs:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd serveur
    - mvn spotbugs:check || true
  artifacts:
    paths:
      - serveur/target/spotbugsXml.xml
    expire_in: 30 days
  cache:
    paths:
      - .m2/repository/
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# ==================== FRONTEND JOBS ====================

frontend:build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - cd client
    - npm ci
    - npm run build
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 day
  cache:
    paths:
      - client/node_modules/
  only:
    - merge_requests
    - main
    - develop
    - tags

frontend:test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd client
    - npm ci
    - npm test -- --watch=false --code-coverage || true
  coverage: '/Statements\s*:\s(\d+\.\d+)%/'
  artifacts:
    paths:
      - client/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
    expire_in: 30 days
  cache:
    paths:
      - client/node_modules/
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

frontend:lint:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  script:
    - cd client
    - npm ci
    - npm run lint || true
  cache:
    paths:
      - client/node_modules/
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# ==================== SECURITY JOBS ====================

security:trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --format sarif -o trivy-results.sarif .
    - trivy fs --exit-code 1 --severity CRITICAL .
  artifacts:
    reports:
      sast: trivy-results.sarif
    expire_in: 30 days
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

security:dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd serveur
    - mvn org.owasp:dependency-check-maven:check
  artifacts:
    paths:
      - serveur/target/dependency-check-report.html
    expire_in: 30 days
  cache:
    paths:
      - .m2/repository/
  allow_failure: true
  only:
    - merge_requests
    - main

# ==================== PACKAGE JOBS ====================

package:backend:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd serveur
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop
    - tags

package:frontend:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      cat > client/Dockerfile.prod << 'EOF'
      FROM node:20-alpine as builder
      WORKDIR /app
      COPY package*.json ./
      RUN npm ci
      COPY . .
      RUN npm run build
      
      FROM nginx:alpine
      COPY --from=builder /app/dist/talent-predict-client/browser /usr/share/nginx/html
      COPY nginx.conf /etc/nginx/nginx.conf
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOF
    - cd client
    - docker build -f Dockerfile.prod -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop
    - tags

# ==================== DEPLOYMENT JOBS ====================

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$STAGING_DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/deploy_key $STAGING_USER@$STAGING_HOST << 'ENDSSH'
      cd $DEPLOY_PATH
      git pull origin develop
      docker-compose pull
      docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d
      docker-compose exec -T backend mvn flyway:migrate || true
      ENDSSH
  environment:
    name: staging
    url: https://staging.talentpredict.com
    deployment_tier: staging
  only:
    - develop

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$PROD_DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/deploy_key $PROD_USER@$PROD_HOST << 'ENDSSH'
      cd $DEPLOY_PATH
      git fetch --all
      git checkout $CI_COMMIT_TAG
      docker-compose pull
      docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
      docker-compose exec -T backend mvn flyway:migrate || true
      ENDSSH
  environment:
    name: production
    url: https://talentpredict.com
    deployment_tier: production
  when: manual
  only:
    - tags

# ==================== INTEGRATION TESTS ====================

integration:tests:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker-compose up -d postgres
    - sleep 10
    - docker-compose up -d backend
    - sleep 15
    - docker-compose run --rm client npm run e2e || true
  artifacts:
    paths:
      - client/cypress/videos/
      - client/cypress/screenshots/
    expire_in: 30 days
  allow_failure: true
  only:
    - merge_requests
    - main

# ==================== QUALITY GATE ====================

quality:gate:
  stage: quality
  image: curlimages/curl:latest
  script:
    - |
      QUALITY_GATE=$(curl -s -u ${SONARQUBE_TOKEN}: ${SONARQUBE_URL}/api/qualitygates/project_status?projectKey=talentpredict | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
      if [ "$QUALITY_GATE" != "OK" ]; then
        echo "Quality gate failed: $QUALITY_GATE"
        exit 1
      fi
  allow_failure: true
  only:
    - merge_requests
    - main