# ============================================================================ 
# TalentPredict Ultimate Pipeline (Fusion)
# ============================================================================ 
stages:
  - build
  - test
  - quality
  - security
  - package
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ==================== TEMPLATES ====================

.maven_template: &maven_template
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  before_script:
    - cd serveur

.node_template: &node_template
  image: node:20-alpine
  cache:
    key: npm-cache-$CI_COMMIT_REF_SLUG
    paths:
      - client/node_modules
      - client/.npm
  before_script:
    - cd client

.docker_template: &docker_template
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

# ==================== BUILD STAGE ====================
backend:build:
  <<: *maven_template
  stage: build
  script:
    - mvn clean install -X -DskipTests  # Added -X to enable full debug logging
  artifacts:
    paths:
      - serveur/target/
    expire_in: 1 hour
    
frontend:build:
  <<: *node_template
  stage: build
  script:
    - npm ci --prefer-offline
    - npm run build -- --configuration production
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 hour

# ==================== TEST STAGE ====================

backend:test:
  <<: *maven_template
  stage: test
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: talentpredict_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/talentpredict_test"
  script:
    - mvn $MAVEN_CLI_OPTS test jacoco:report  # Runs tests and generates Jacoco coverage report
  artifacts:
    reports:
      junit: serveur/target/surefire-reports/TEST-*.xml  # JUnit reports
    paths:
      - serveur/target/site/jacoco/  # Jacoco coverage reports
  coverage: '/Total.*?([0-9]{1,3})%/'  # Coverage regex for GitLab UI

frontend:test:
  <<: *node_template
  stage: test
  script:
    - npm run test -- --run --coverage  # Runs frontend tests
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura  # Coverage in Cobertura format
        path: client/coverage/cobertura-coverage.xml

# ==================== QUALITY & SECURITY ====================

quality:sonarqube:
  <<: *maven_template
  stage: quality
  script:
    - mvn sonar:sonar -Dsonar.projectKey=talentpredict -Dsonar.host.url=$SONARQUBE_URL -Dsonar.login=$SONARQUBE_TOKEN
  allow_failure: true  # Allow failure to not block pipeline

security:trivy_scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --severity HIGH,CRITICAL --format sarif -o results.sarif .  # Run Trivy security scan
  artifacts:
    reports:
      sast: results.sarif  # Store security scan results

security:dependency_check:
  <<: *maven_template
  stage: security
  script:
    - mvn org.owasp:dependency-check-maven:check  # OWASP dependency check
  allow_failure: true  # Allow failure to not block pipeline

# ==================== PACKAGE STAGE ====================

package:backend:
  <<: *docker_template
  stage: package
  script:
    - cd serveur
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest .  # Build backend Docker image
    - docker push $BACKEND_IMAGE:$IMAGE_TAG  # Push backend image
    - docker push $BACKEND_IMAGE:latest  # Push latest backend image

package:frontend:
  <<: *docker_template
  stage: package
  script:
    - cd client
    - docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest .  # Build frontend Docker image
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG  # Push frontend image
    - docker push $FRONTEND_IMAGE:latest  # Push latest frontend image

# ==================== DEPLOY STAGE ====================

.deploy_template: &deploy_template
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -  # Add private key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts  # Ensure server SSH key is known

deploy:staging:
  <<: *deploy_template
  stage: deploy
  variables:
    SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY_STAGING"
    SERVER_HOST: "$STAGING_SERVER_HOST"
  script:
    - ssh $STAGING_USER@$STAGING_SERVER_HOST "cd /opt/talentpredict && docker-compose pull && docker-compose up -d"
  environment:
    name: staging
  only:
    - develop  # Triggered on develop branch

deploy:production:
  <<: *deploy_template
  stage: deploy
  variables:
    SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY_PROD"
    SERVER_HOST: "$PROD_SERVER_HOST"
  script:
    - ssh $PROD_USER@$PROD_SERVER_HOST "cd /opt/talentpredict && docker-compose up -d"
  when: manual  # Manual trigger for production deployment
  environment:
    name: production
  only:
    - main  # Triggered on main branch

rollback:production:
  <<: *deploy_template
  stage: deploy
  variables:
    SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY_PROD"
    SERVER_HOST: "$PROD_SERVER_HOST"
  script:
    - echo "Executing rollback to previous stable version..."
    - ssh $PROD_USER@$PROD_SERVER_HOST "cd /opt/talentpredict && docker-compose down && docker-compose pull $ROLLBACK_TAG && docker-compose up -d"
  when: manual  # Manual trigger for rollback
  environment:
    name: production
    action: stop
  only:
    - main  # Triggered on main branch

# ==================== NOTIFICATIONS ====================

notify:success:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "{\"text\":\"✅ Pipeline #$CI_PIPELINE_ID succeeded on $CI_COMMIT_REF_NAME\nCommit: $CI_COMMIT_SHORT_SHA\nAuthor: $CI_COMMIT_AUTHOR\"}"
  when: on_success
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

notify:failure:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "{\"text\":\"❌ Pipeline #$CI_PIPELINE_ID failed on $CI_COMMIT_REF_NAME\nCommit: $CI_COMMIT_SHORT_SHA\nAuthor: $CI_COMMIT_AUTHOR\"}"
  when: on_failure
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
