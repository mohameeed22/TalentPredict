# ============================================================================
# TalentPredict Ultimate Pipeline (Fusion)
# ============================================================================
stages:
  - build
  - test
  - quality
  - security
  - package
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ==================== TEMPLATES ====================

.maven_template: &maven_template
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  before_script:
    - cd serveur

.node_template: &node_template
  image: node:20-alpine
  cache:
    key: npm-cache-$CI_COMMIT_REF_SLUG
    paths:
      - client/node_modules
      - client/.npm
  before_script:
    - cd client

.docker_template: &docker_template
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

# ==================== BUILD STAGE ====================

backend:build:
  <<: *maven_template
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean compile -DskipTests
  artifacts:
    paths:
      - serveur/target/
    expire_in: 1 hour

frontend:build:
  <<: *node_template
  stage: build
  script:
    - npm ci --prefer-offline
    - npm run build -- --configuration production
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 hour

# ==================== TEST STAGE ====================

backend:test:
  <<: *maven_template
  stage: test
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: talentpredict_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/talentpredict_test"
  script:
    - mvn $MAVEN_CLI_OPTS test jacoco:report
  artifacts:
    reports:
      junit: serveur/target/surefire-reports/TEST-*.xml
    paths:
      - serveur/target/site/jacoco/
  coverage: '/Total.*?([0-9]{1,3})%/'

frontend:test:
  <<: *node_template
  stage: test
  script:
    - npm run test -- --run --coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml

# ==================== QUALITY & SECURITY ====================

quality:sonarqube:
  <<: *maven_template
  stage: quality
  script:
    - mvn sonar:sonar -Dsonar.projectKey=talentpredict -Dsonar.host.url=$SONARQUBE_URL -Dsonar.login=$SONARQUBE_TOKEN
  allow_failure: true

security:trivy_scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --severity HIGH,CRITICAL --format sarif -o results.sarif .
  artifacts:
    reports:
      sast: results.sarif

security:dependency_check:
  <<: *maven_template
  stage: security
  script:
    - mvn org.owasp:dependency-check-maven:check
  allow_failure: true

# ==================== PACKAGE STAGE ====================

package:backend:
  <<: *docker_template
  stage: package
  script:
    - cd serveur
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest .
    - docker push $BACKEND_IMAGE:$IMAGE_TAG
    - docker push $BACKEND_IMAGE:latest

package:frontend:
  <<: *docker_template
  stage: package
  script:
    - cd client
    - docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest .
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG
    - docker push $FRONTEND_IMAGE:latest

# ==================== DEPLOY STAGE ====================

.deploy_template: &deploy_template
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts

deploy:staging:
  <<: *deploy_template
  stage: deploy
  variables:
    SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY_STAGING"
    SERVER_HOST: "$STAGING_SERVER_HOST"
  script:
    - ssh $STAGING_USER@$STAGING_SERVER_HOST "cd /opt/talentpredict && docker-compose pull && docker-compose up -d"
  environment:
    name: staging
  only:
    - develop

deploy:production:
  <<: *deploy_template
  stage: deploy
  variables:
    SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY_PROD"
    SERVER_HOST: "$PROD_SERVER_HOST"
  script:
    - ssh $PROD_USER@$PROD_SERVER_HOST "cd /opt/talentpredict && docker-compose up -d"
  when: manual
  environment:
    name: production
  only:
    - main

rollback:production:
  stage: deploy
  script:
    - echo "Executing rollback to previous stable version..."
    # Script SSH pour relancer l'ancienne version
  when: manual
  only:
    - main