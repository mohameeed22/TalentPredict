# ================================================================
#  TalentPredict — Production-Ready GitLab CI/CD
#  Dual Pipeline: Backend (Spring Boot) + Frontend (Angular)
#  Environments: development | staging | production
# ================================================================

# --------------------------------------------------
#  Global Variables
# --------------------------------------------------
variables:
  # --- Docker / Registry ---
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE:  "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

  # --- Maven ---
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

  # --- Node ---
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

  # --- Deployment Ports ---
  BACKEND_PORT: "8081"
  FRONTEND_PORT: "80"

# --------------------------------------------------
#  Stages (shared by both pipelines)
# --------------------------------------------------
stages:
  - install       # Frontend dependency installation
  - build         # Compile / bundle
  - test          # Unit & integration tests
  - quality       # Static analysis & linting
  - security      # Dependency & container scanning
  - package       # Docker image build & push
  - deploy        # Environment deployments

# --------------------------------------------------
#  Default Settings
# --------------------------------------------------
default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ================================================================
#
#                    BACKEND PIPELINE
#            Spring Boot 3.4 · Java 21 · Maven
#
# ================================================================

# --------------------------------------------------
#  Backend Cache (Maven .m2)
# --------------------------------------------------
.backend_cache: &backend_cache
  cache:
    key: "backend-maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository/
    policy: pull-push

# --------------------------------------------------
#  Backend Rules — only trigger on BackEnd/ changes
# --------------------------------------------------
.backend_rules: &backend_rules
  rules:
    - changes:
        - BackEnd/**/*
      when: on_success
    - when: never

# --------------------------------------------------
#  Backend Base Job
# --------------------------------------------------
.backend_base:
  image: maven:3.9.9-eclipse-temurin-21-alpine
  <<: *backend_cache
  <<: *backend_rules
  before_script:
    - cd BackEnd

# ============ BUILD ============
backend:build:
  extends: .backend_base
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - BackEnd/target/
    expire_in: 1 day

# ============ TEST ============
backend:test:
  extends: .backend_base
  stage: test
  needs: ["backend:build"]
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    paths:
      - BackEnd/target/surefire-reports/
    reports:
      junit:
        - BackEnd/target/surefire-reports/TEST-*.xml
    expire_in: 7 days

# ============ QUALITY ============
# Static code analysis via Maven Verify (Checkstyle / PMD / SpotBugs)
backend:quality:
  extends: .backend_base
  stage: quality
  needs: ["backend:build"]
  script:
    - mvn $MAVEN_CLI_OPTS verify -DskipTests
  allow_failure: true
  artifacts:
    paths:
      - BackEnd/target/site/
    expire_in: 7 days

# ============ SECURITY ============
# OWASP Dependency-Check — fails build on CVSS >= 8
backend:security:
  extends: .backend_base
  stage: security
  needs: ["backend:build"]
  script:
    - mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:check
      -DfailBuildOnCVSS=8
      -DsuppressionFile=owasp-suppressions.xml || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - BackEnd/target/dependency-check-report.html
    expire_in: 30 days

# ============ PACKAGE ============
# Build & push multi-stage Docker image to GitLab Container Registry
backend:package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  <<: *backend_rules
  needs: ["backend:test"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd BackEnd
    # Build with commit SHA tag + branch tag for caching
    - >
      docker build
      --cache-from "$BACKEND_IMAGE:latest"
      --tag "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --tag "$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG"
      --tag "$BACKEND_IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      .
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      changes:
        - BackEnd/**/*
      when: on_success
    - when: never

# ============ DEPLOY — Development ============
backend:deploy:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:package"]
  environment:
    name: development
    url: https://dev.talentpredict.local
    on_stop: backend:stop:dev
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Deploying Backend to DEVELOPMENT ==="
    # Pull the newly built image
    - docker pull "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Stop existing container (if any) for rollback safety
    - docker stop talentpredict-backend-dev || true
    - docker rm   talentpredict-backend-dev || true
    # Run new container with environment variables
    - >
      docker run -d
      --name talentpredict-backend-dev
      --restart unless-stopped
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=development
      -e SPRING_DATASOURCE_URL="${DEV_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${DEV_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${DEV_DB_PASSWORD}"
      -e JWT_SECRET="${DEV_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Backend dev deployment complete — image:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - BackEnd/**/*
      when: on_success
    - when: never

# Stop job for dev environment cleanup
backend:stop:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: development
    action: stop
  script:
    - docker stop talentpredict-backend-dev || true
    - docker rm   talentpredict-backend-dev || true
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
    - when: never

# ============ DEPLOY — Staging ============
backend:deploy:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:package"]
  environment:
    name: staging
    url: https://staging.talentpredict.local
    on_stop: backend:stop:staging
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Deploying Backend to STAGING ==="
    - docker pull "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker stop talentpredict-backend-staging || true
    - docker rm   talentpredict-backend-staging || true
    - >
      docker run -d
      --name talentpredict-backend-staging
      --restart unless-stopped
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=staging
      -e SPRING_DATASOURCE_URL="${STAGING_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${STAGING_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${STAGING_DB_PASSWORD}"
      -e JWT_SECRET="${STAGING_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Backend staging deployment complete — image:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - BackEnd/**/*
      when: on_success
    - when: never

backend:stop:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: staging
    action: stop
  script:
    - docker stop talentpredict-backend-staging || true
    - docker rm   talentpredict-backend-staging || true
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never

# ============ DEPLOY — Production ============
# Manual gate + only on Git tags (e.g., v1.0.0)
backend:deploy:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:package"]
  environment:
    name: production
    url: https://talentpredict.com
    on_stop: backend:stop:production
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Deploying Backend to PRODUCTION ==="
    - docker pull "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Keep previous image tagged for rollback
    - docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$BACKEND_IMAGE:rollback" || true
    - docker stop talentpredict-backend-prod || true
    - docker rm   talentpredict-backend-prod || true
    - >
      docker run -d
      --name talentpredict-backend-prod
      --restart unless-stopped
      --memory=1g
      --memory-reservation=512m
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=production
      -e SPRING_DATASOURCE_URL="${PROD_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${PROD_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${PROD_DB_PASSWORD}"
      -e JWT_SECRET="${PROD_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      -e JAVA_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Backend production deployment complete — image:$CI_COMMIT_SHORT_SHA"
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never

backend:stop:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    action: stop
  script:
    - docker stop talentpredict-backend-prod || true
    - docker rm   talentpredict-backend-prod || true
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never

# Rollback production to previous image
backend:rollback:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    url: https://talentpredict.com
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== ROLLING BACK Backend in PRODUCTION ==="
    - docker stop talentpredict-backend-prod || true
    - docker rm   talentpredict-backend-prod || true
    - >
      docker run -d
      --name talentpredict-backend-prod
      --restart unless-stopped
      --memory=1g
      --memory-reservation=512m
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=production
      -e SPRING_DATASOURCE_URL="${PROD_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${PROD_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${PROD_DB_PASSWORD}"
      -e JWT_SECRET="${PROD_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      "$BACKEND_IMAGE:rollback"
    - echo "⏪ Backend rolled back to previous image"
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never


# ================================================================
#
#                   FRONTEND PIPELINE
#               Angular 21 · Node 22 · Nginx
#
# ================================================================

# --------------------------------------------------
#  Frontend Cache (node_modules + npm)
# --------------------------------------------------
.frontend_cache: &frontend_cache
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - FrontEnd/node_modules/
      - .npm/
    policy: pull-push

# --------------------------------------------------
#  Frontend Rules — only trigger on FrontEnd/ changes
# --------------------------------------------------
.frontend_rules: &frontend_rules
  rules:
    - changes:
        - FrontEnd/**/*
      when: on_success
    - when: never

# --------------------------------------------------
#  Frontend Base Job
# --------------------------------------------------
.frontend_base:
  image: node:22-alpine
  <<: *frontend_cache
  <<: *frontend_rules
  before_script:
    - cd FrontEnd

# ============ INSTALL ============
# Install dependencies — cached to avoid repeated downloads
frontend:install:
  extends: .frontend_base
  stage: install
  script:
    - npm ci --legacy-peer-deps --prefer-offline
  artifacts:
    paths:
      - FrontEnd/node_modules/
    expire_in: 1 day

# ============ BUILD ============
# Production build with AOT compilation
frontend:build:
  extends: .frontend_base
  stage: build
  needs: ["frontend:install"]
  script:
    - npm run build -- --configuration production
  artifacts:
    paths:
      - FrontEnd/dist/
    expire_in: 1 day

# ============ TEST ============
# Unit tests via Vitest
frontend:test:
  extends: .frontend_base
  stage: test
  needs: ["frontend:install"]
  script:
    - npx vitest run --reporter=junit --outputFile=test-results.xml || true
  artifacts:
    when: always
    reports:
      junit:
        - FrontEnd/test-results.xml
    expire_in: 7 days

# ============ QUALITY ============
# Lint with Angular ESLint (if configured) or basic TS check
frontend:quality:
  extends: .frontend_base
  stage: quality
  needs: ["frontend:install"]
  script:
    - npx ng lint --force || echo "⚠ Lint not configured — add @angular-eslint for full linting"
    - npx tsc --noEmit || true
  allow_failure: true

# ============ SECURITY ============
# npm audit for known vulnerabilities in dependencies
frontend:security:
  extends: .frontend_base
  stage: security
  needs: ["frontend:install"]
  script:
    - npm audit --audit-level=high --omit=dev || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - FrontEnd/npm-audit.json
    expire_in: 30 days

# ============ PACKAGE ============
# Build & push multi-stage nginx Docker image
frontend:package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  <<: *frontend_rules
  needs: ["frontend:build", "frontend:test"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd FrontEnd
    - >
      docker build
      --cache-from "$FRONTEND_IMAGE:latest"
      --tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --tag "$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG"
      --tag "$FRONTEND_IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      .
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      changes:
        - FrontEnd/**/*
      when: on_success
    - when: never

# ============ DEPLOY — Development ============
frontend:deploy:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:package"]
  environment:
    name: development
    url: https://dev.talentpredict.local
    on_stop: frontend:stop:dev
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Deploying Frontend to DEVELOPMENT ==="
    - docker pull "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker stop talentpredict-frontend-dev || true
    - docker rm   talentpredict-frontend-dev || true
    - >
      docker run -d
      --name talentpredict-frontend-dev
      --restart unless-stopped
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-dev:${BACKEND_PORT}"
      "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Frontend dev deployment complete — image:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - FrontEnd/**/*
      when: on_success
    - when: never

frontend:stop:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: development
    action: stop
  script:
    - docker stop talentpredict-frontend-dev || true
    - docker rm   talentpredict-frontend-dev || true
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
    - when: never

# ============ DEPLOY — Staging ============
frontend:deploy:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:package"]
  environment:
    name: staging
    url: https://staging.talentpredict.local
    on_stop: frontend:stop:staging
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Deploying Frontend to STAGING ==="
    - docker pull "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker stop talentpredict-frontend-staging || true
    - docker rm   talentpredict-frontend-staging || true
    - >
      docker run -d
      --name talentpredict-frontend-staging
      --restart unless-stopped
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-staging:${BACKEND_PORT}"
      "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Frontend staging deployment complete — image:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - FrontEnd/**/*
      when: on_success
    - when: never

frontend:stop:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: staging
    action: stop
  script:
    - docker stop talentpredict-frontend-staging || true
    - docker rm   talentpredict-frontend-staging || true
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never

# ============ DEPLOY — Production ============
frontend:deploy:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:package"]
  environment:
    name: production
    url: https://talentpredict.com
    on_stop: frontend:stop:production
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Deploying Frontend to PRODUCTION ==="
    - docker pull "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:rollback" || true
    - docker stop talentpredict-frontend-prod || true
    - docker rm   talentpredict-frontend-prod || true
    - >
      docker run -d
      --name talentpredict-frontend-prod
      --restart unless-stopped
      --memory=256m
      --memory-reservation=128m
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-prod:${BACKEND_PORT}"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "✅ Frontend production deployment complete — image:$CI_COMMIT_SHORT_SHA"
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never

frontend:stop:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    action: stop
  script:
    - docker stop talentpredict-frontend-prod || true
    - docker rm   talentpredict-frontend-prod || true
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never

# Rollback production frontend to previous image
frontend:rollback:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    url: https://talentpredict.com
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== ROLLING BACK Frontend in PRODUCTION ==="
    - docker stop talentpredict-frontend-prod || true
    - docker rm   talentpredict-frontend-prod || true
    - >
      docker run -d
      --name talentpredict-frontend-prod
      --restart unless-stopped
      --memory=256m
      --memory-reservation=128m
      -p "${FRONTEND_PORT}:80"
      "$FRONTEND_IMAGE:rollback"
    - echo "⏪ Frontend rolled back to previous image"
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
