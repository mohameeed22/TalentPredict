stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

backend:build:
  image: maven:3.9-eclipse-temurin-21
  stage: build
  cache:
    key: maven-cache
    paths:
      - .m2/repository
  script:
    - cd BackEnd
    - mvn $MAVEN_CLI_OPTS clean compile -DskipTests
  artifacts:
    paths:
      - BackEnd/target/
    expire_in: 1 hour

frontend:build:
  image: node:22-alpine
  stage: build
  cache:
    key: npm-cache
    paths:
      - FrontEnd/node_modules
  script:
    - cd FrontEnd
    - npm ci --legacy-peer-deps
    - npm run build -- --configuration production
  artifacts:
    paths:
      - FrontEnd/dist/talent-predict-client/
    expire_in: 1 hour

backend:test:
  image: maven:3.9-eclipse-temurin-21
  stage: test
  cache:
    key: maven-cache
    paths:
      - .m2/repository
  script:
    - cd BackEnd
    - mvn $MAVEN_CLI_OPTS test || true
  allow_failure: true

frontend:test:
  image: node:22-alpine
  stage: test
  cache:
    key: npm-cache
    paths:
      - FrontEnd/node_modules
  script:
    - cd FrontEnd
    - npm ci --legacy-peer-deps
    - npm run test -- --watch=false || true
  allow_failure: true

package:backend:
  image: docker:24
  services:
    - docker:24-dind
  stage: package
  script:
    - cd BackEnd
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
  only:
    - main

package:frontend:
  image: docker:24
  services:
    - docker:24-dind
  stage: package
  script:
    - cd FrontEnd
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
  only:
    - main
