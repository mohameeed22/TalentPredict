# ============================================
# TalentPredict Backend - Simple CI/CD
# Java 21 | Spring Boot 3.4
# ============================================

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend"

cache:
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - quality
  - security
  - package
  - deploy

# ============================================
# BUILD
# ============================================

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21-alpine
  script:
    - cd BackEnd
    - mvn clean compile
  artifacts:
    paths:
      - BackEnd/target/
    expire_in: 1 day

# ============================================
# TEST
# ============================================

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21-alpine
  script:
    - cd BackEnd
    - mvn test
  artifacts:
    reports:
      junit:
        - BackEnd/target/surefire-reports/TEST-*.xml

# ============================================
# QUALITY (Code Quality Check)
# ============================================

quality:
  stage: quality
  image: maven:3.9.9-eclipse-temurin-21-alpine
  script:
    - cd BackEnd
    - mvn verify -DskipTests
  allow_failure: true

# ============================================
# SECURITY (Dependency Scan)
# ============================================

security:
  stage: security
  image: maven:3.9.9-eclipse-temurin-21-alpine
  script:
    - cd BackEnd
    - mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8
  allow_failure: true

# ============================================
# PACKAGE (Docker Image)
# ============================================

package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd BackEnd
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  only:
    - main

# ============================================
# DEPLOY (Simple)
# ============================================

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploy step executed"
    - echo "Here you can add SSH deploy or server deployment logic"
  when: manual
  only:
    - main
