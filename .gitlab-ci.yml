# ================================================================
#  TalentPredict — GitLab CI/CD
#  Two independent pipelines included from .gitlab/
# ================================================================

# --------------------------------------------------
#  Global Variables
# --------------------------------------------------
variables:
  # --- Docker / Registry ---
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE:  "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

  # --- Maven ---
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

  # --- Node ---
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

  # --- Deployment Ports ---
  BACKEND_PORT: "8081"
  FRONTEND_PORT: "80"

# --------------------------------------------------
#  Stages (shared by both pipelines)
# --------------------------------------------------
stages:
  - install       # Frontend dependency installation
  - build         # Compile / bundle
  - test          # Unit & integration tests
  - quality       # Static analysis & linting
  - security      # Dependency scanning
  - package       # Docker image build & push
  - deploy        # Environment deployments

# --------------------------------------------------
#  Default Settings
# --------------------------------------------------
default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# --------------------------------------------------
#  Include separate pipeline files
# --------------------------------------------------
include:
  - local: ".gitlab/backend-ci.yml"
  - local: ".gitlab/frontend-ci.yml"
