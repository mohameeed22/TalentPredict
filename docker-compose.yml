services:
  # ============================================
  # n8n Workflow Automation ONLY
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: talentpredict-n8n
    environment:
      # n8n uses SQLite by default (embedded in volume)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-MinimumSixteenCharactersKey}
      # n8n Web interface configuration
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      # URL configuration for webhook access
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      # Logging
      NODE_ENV: production
      TZ: UTC
    ports:
      - "5678:5678"  # n8n Web UI + Webhooks
    volumes:
      - n8n_data:/home/node/.n8n
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:

networks:
  talentpredict-net:
    driver: bridge


