version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: talentpredict-db
    environment:
      POSTGRES_DB: talentpredict
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "11111111"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentpredict"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentpredict-net

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: talentpredict-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentpredict
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "11111111"
      N8N_URL: http://n8n:5678
      AI_SERVICE_URL: http://ai-service:8000
      CV_EXTRACTOR_URL: http://cv-extractor:9000
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-http://host.docker.internal:11434/v1/chat/completions}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-ollama}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-llama3.2:latest}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      OPENROUTER_BACKOFF_BASE_MS: ${OPENROUTER_BACKOFF_BASE_MS:-800}
      HTTP_CLIENT_CONNECT_TIMEOUT_MS: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:-5000}
      HTTP_CLIENT_READ_TIMEOUT_MS: ${HTTP_CLIENT_READ_TIMEOUT_MS:-45000}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talentpredict-net
    restart: on-failure

  # ============================================
  # Python AI Service
  # ============================================
  ai-service:
    build:
      context: ./talentpredict-ai
      dockerfile: Dockerfile
    container_name: talentpredict-ai
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ORIGINS: "http://localhost:4200,http://localhost:80,http://frontend:80"
    ports:
      - "8000:8000"
    networks:
      - talentpredict-net
    restart: on-failure

  # ============================================
  # CV Text Extraction Service (Python)
  # Called by n8n and Backend for PDF/DOCX parsing
  # ============================================
  cv-extractor:
    build:
      context: ./talentpredict-ai
      dockerfile: Dockerfile.cv-extractor
    container_name: talentpredict-cv-extractor
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "9000:9000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentpredict-net

  # ============================================
  # n8n Workflow Engine (SQLite embedded)
  # ============================================
  n8n:
    build:
      context: ./n8n/custom
      dockerfile: Dockerfile
    container_name: talentpredict-n8n
    depends_on:
      cv-extractor:
        condition: service_healthy
    environment:
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-MinimumSixteenCharactersKey}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      NODE_ENV: production
      TZ: UTC
      CV_EXTRACTOR_URL: http://cv-extractor:9000
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentpredict-net

  # ============================================
  # Angular Frontend (served via nginx)
  # ============================================
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: talentpredict-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - talentpredict-net
    restart: on-failure

volumes:
  postgres_data:
  n8n_data:

networks:
  talentpredict-net:
    driver: bridge


