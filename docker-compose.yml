version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: talentpredict-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentpredict
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-11111111}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - talentpredict-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentpredict"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Service (Spring Boot)
  # ============================================
  backend:
    build:
      context: ./serveur
      dockerfile: Dockerfile
    container_name: talentpredict-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentpredict
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-11111111}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-TalentPredictSecretKeyForJWTAuthenticationMustBeLongEnough256Bits}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8090:8090"
    networks:
      - talentpredict-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # Frontend Service (Angular SSR + Node.js)
  # ============================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: talentpredict-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "4000:4000"
    networks:
      - talentpredict-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  talentpredict-network:
    driver: bridge

volumes:
  postgres_data:
