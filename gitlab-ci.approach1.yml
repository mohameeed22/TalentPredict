# =============================================================================
# APPROACH 1 — Single root .gitlab-ci.yml with path-filtered jobs
#
# HOW IT WORKS:
#   Every job carries a `rules: changes:` block that scopes it to its folder.
#   GitLab evaluates the changed files and skips irrelevant jobs automatically.
#
# PROS  : Simple, one file to maintain, full pipeline history in one view.
# CONS  : Grows large over time; all jobs share one pipeline graph, which can
#         be visually noisy on monorepos with many modules.
# =============================================================================

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
default:
  interruptible: true          # Newer pushes cancel older running pipelines

# ---------------------------------------------------------------------------
# Workflow — skip draft MR pipelines to save CI minutes
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^Draft:/'
      when: never
    - when: always

# ---------------------------------------------------------------------------
# Stages — frontend jobs run in parallel with backend jobs of the same stage
# ---------------------------------------------------------------------------
stages:
  - build
  - test
  - package
  - deploy

# ===========================================================================
# ██████████████████   FRONTEND  (Angular 21 / SSR)   ██████████████████████
# ===========================================================================

# Path filter reused across all frontend jobs (YAML anchor)
.frontend-changes: &frontend-changes
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - FrontEnd/**/*
        - FrontEnd/.env*

# Node.js cache shared by all frontend jobs
.frontend-cache: &frontend-cache
  cache:
    key:
      files:
        - FrontEnd/package-lock.json   # Invalidate cache only when lock file changes
    paths:
      - FrontEnd/node_modules/
    policy: pull                        # Jobs only pull; install job pushes

# ── frontend:install ────────────────────────────────────────────────────────
frontend:install:
  stage: build
  image: node:22-alpine
  <<: *frontend-changes
  cache:
    key:
      files:
        - FrontEnd/package-lock.json
    paths:
      - FrontEnd/node_modules/
    policy: push                        # This job fills the cache
  script:
    - cd FrontEnd
    - echo "Installing npm dependencies..."
    - npm ci --prefer-offline           # Reproducible, faster than 'npm install'
  artifacts:
    paths:
      - FrontEnd/node_modules/          # Pass node_modules to downstream jobs
    expire_in: 1 hour                   # Keep artifact only for the pipeline run

# ── frontend:build:prod ──────────────────────────────────────────────────────
frontend:build:prod:
  stage: build
  image: node:22-alpine
  needs: [frontend:install]             # Start as soon as install finishes
  <<: *frontend-changes
  <<: *frontend-cache
  script:
    - cd FrontEnd
    - echo "Building Angular app (production)..."
    - npx ng build --configuration production --no-progress
  artifacts:
    name: "frontend-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - FrontEnd/dist/                  # Angular output (browser + server bundles)
    expire_in: 7 days

# ── frontend:test ────────────────────────────────────────────────────────────
frontend:test:
  stage: test
  image: node:22-alpine
  needs: [frontend:install]
  <<: *frontend-changes
  <<: *frontend-cache
  before_script:
    # Install Chromium for Karma headless tests
    - apk add --no-cache chromium
    - export CHROME_BIN=/usr/bin/chromium-browser
  script:
    - cd FrontEnd
    - echo "Running Angular unit tests (headless)..."
    - npx ng test --watch=false --browsers=ChromeHeadless --no-progress
  coverage: '/Statements\s*:\s*([\d.]+)%/'   # Parse coverage from karma output
  artifacts:
    when: always                         # Upload even on failure to inspect reports
    reports:
      junit: FrontEnd/junit-test-results.xml  # Requires karma-junit-reporter
    expire_in: 7 days
  allow_failure: false

# ── frontend:deploy ──────────────────────────────────────────────────────────
frontend:deploy:
  stage: deploy
  image: alpine:3.19
  needs: [frontend:build:prod, frontend:test]
  <<: *frontend-changes
  environment:
    name: production/frontend
    url: https://talentpredict.example.com   # Replace with real URL
  when: manual                          # Require explicit approval before deploying
  script:
    - echo "Deploy placeholder — wire up your hosting provider here."
    - echo "Examples: Firebase Hosting, Nginx static upload, S3+CloudFront, Azure SWA..."
    # Example: npx firebase deploy --only hosting --token "$FIREBASE_TOKEN"

# ===========================================================================
# ██████████████████   BACKEND  (Spring Boot 3 / Java 21)  ████████████████
# ===========================================================================

# Path filter reused across all backend jobs
.backend-changes: &backend-changes
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - BackEnd/**/*
        - BackEnd/.env*

# Maven local repository cache — dramatically speeds up repeated builds
.backend-cache: &backend-cache
  cache:
    key:
      files:
        - BackEnd/pom.xml               # Invalidate only when dependencies change
    paths:
      - .m2/repository/                 # Shared Maven local repo (project root)
    policy: pull-push

# Maven options reused across jobs
variables:
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -XX:+TieredCompilation
    -XX:TieredStopAtLevel=1            # Faster JVM startup in CI
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --no-transfer-progress"

# ── backend:compile ───────────────────────────────────────────────────────────
backend:compile:
  stage: build
  image: eclipse-temurin:21-jdk-alpine   # Matches Java 21 in pom.xml
  <<: *backend-changes
  <<: *backend-cache
  script:
    - cd BackEnd
    - echo "Compiling Spring Boot project..."
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - BackEnd/target/classes/
    expire_in: 1 hour

# ── backend:test ──────────────────────────────────────────────────────────────
backend:test:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  needs: [backend:compile]
  <<: *backend-changes
  <<: *backend-cache
  script:
    - cd BackEnd
    - echo "Running JUnit tests..."
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit: BackEnd/target/surefire-reports/TEST-*.xml   # Parsed by GitLab for MR widget
    paths:
      - BackEnd/target/surefire-reports/
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%/'   # Parse from JaCoCo coverage report

# ── backend:package ───────────────────────────────────────────────────────────
backend:package:
  stage: package
  image: eclipse-temurin:21-jdk-alpine
  needs: [backend:test]
  <<: *backend-changes
  <<: *backend-cache
  script:
    - cd BackEnd
    - echo "Packaging JAR (skip tests — already executed)..."
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    name: "backend-jar-$CI_COMMIT_SHORT_SHA"
    paths:
      - BackEnd/target/talentpredict-*.jar   # Matches talentpredict-1.0-SNAPSHOT.jar
    expire_in: 7 days

# ── backend:deploy ────────────────────────────────────────────────────────────
backend:deploy:
  stage: deploy
  image: alpine:3.19
  needs: [backend:package]
  <<: *backend-changes
  environment:
    name: production/backend
    url: https://api.talentpredict.example.com  # Replace with real URL
  when: manual
  script:
    - echo "Deploy placeholder — wire up your target server here."
    - echo "Examples: Docker push, SSH scp, Kubernetes kubectl apply, AWS ECS deploy..."
    # Example (Docker):
    #   docker build -t registry.example.com/talentpredict/backend:$CI_COMMIT_SHORT_SHA BackEnd/
    #   docker push registry.example.com/talentpredict/backend:$CI_COMMIT_SHORT_SHA
