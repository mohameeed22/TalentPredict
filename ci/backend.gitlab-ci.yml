# =============================================================================
# BACKEND CHILD PIPELINE — Spring Boot 3.4 / Java 21 / Maven
# File: ci/backend.gitlab-ci.yml
#
# This file is NOT triggered directly. It is included by the root
# .gitlab-ci.yml via a `trigger:` child pipeline when changes are detected
# under BackEnd/**
# =============================================================================

# ---------------------------------------------------------------------------
# Stages for this child pipeline
# ---------------------------------------------------------------------------
stages:
  - compile       # javac compilation check
  - test          # JUnit / JaCoCo
  - package       # Produce the fat JAR
  - deploy        # Placeholder for future server/container deployment

# ---------------------------------------------------------------------------
# Maven tuning — applied globally to all jobs in this pipeline
# ---------------------------------------------------------------------------
variables:
  # Keep the local Maven repository inside the project root so GitLab cache
  # can persist it across pipelines without root-level path tricks.
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -XX:+TieredCompilation
    -XX:TieredStopAtLevel=1
  # Flags applied to every mvn call: batch (no interactive prompts), hide transfer,
  # fail-at-end (collect all errors before stopping).
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --no-transfer-progress"

# ---------------------------------------------------------------------------
# Shared Maven cache anchor — invalidated only when pom.xml changes
# ---------------------------------------------------------------------------
.maven-cache: &maven-cache
  cache:
    key:
      files:
        - BackEnd/pom.xml
    paths:
      - .m2/repository/
    policy: pull-push                  # Each job reads and writes the cache

# ===========================================================================
# STAGE: compile
# ===========================================================================
compile:
  stage: compile
  image: eclipse-temurin:21-jdk-alpine  # Matches java.version=21 in pom.xml
  <<: *maven-cache
  script:
    - cd BackEnd
    - echo ">>> Compiling Spring Boot project..."
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - BackEnd/target/classes/
    expire_in: 1 hour               # Only needed for downstream jobs in this run

# ===========================================================================
# STAGE: test
# ===========================================================================
test:unit:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  needs: [compile]
  <<: *maven-cache
  script:
    - cd BackEnd
    - echo ">>> Running JUnit 5 tests with Surefire..."
    # -Dspring.profiles.active=test ensures application-test.properties is loaded
    - mvn $MAVEN_CLI_OPTS test -Dspring.profiles.active=test
  artifacts:
    when: always                       # Publish Surefire XML even on test failure
    reports:
      # GitLab parses these XMLs and shows a test summary widget on MRs
      junit: BackEnd/target/surefire-reports/TEST-*.xml
    paths:
      - BackEnd/target/surefire-reports/
      - BackEnd/target/site/jacoco/    # JaCoCo HTML report (if configured)
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%/' # Regex parsed from JaCoCo summary log

# ===========================================================================
# STAGE: package
# ===========================================================================
package:jar:
  stage: package
  image: eclipse-temurin:21-jdk-alpine
  needs: [test:unit]                   # Package only after tests pass
  <<: *maven-cache
  script:
    - cd BackEnd
    - echo ">>> Packaging Spring Boot fat JAR..."
    # -DskipTests: tests already passed in the previous stage
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - echo ">>> JAR artifact:"
    - ls -lh target/talentpredict-*.jar
  artifacts:
    name: "backend-jar-$CI_COMMIT_SHORT_SHA"
    paths:
      # Wildcard matches talentpredict-1.0-SNAPSHOT.jar and future versioned JARs
      - BackEnd/target/talentpredict-*.jar
    expire_in: 7 days

# ===========================================================================
# STAGE: deploy
# ===========================================================================

# ── Production deploy (manual gate) ─────────────────────────────────────────
deploy:production:
  stage: deploy
  image: alpine:3.19
  needs: [package:jar]
  environment:
    name: production
    url: https://api.talentpredict.example.com
  when: manual                         # Human approval before hitting production
  only:
    - main
  before_script:
    # Install tools as needed (ssh, curl, docker CLI, kubectl, etc.)
    - apk add --no-cache openssh-client
  script:
    - echo ">>> DEPLOY PLACEHOLDER"
    - echo "Replace this block with your actual steps, for example:"
    - echo "  - Docker build+push to registry, then kubectl rollout"
    - echo "  - SCP/SSH: scp BackEnd/target/*.jar user@host:/opt/talentpredict/"
    - echo "  - AWS ECS: aws ecs update-service --force-new-deployment"
    - echo "  - Azure App Service: az webapp deploy --src-path target/*.jar"

# ── Staging deploy (automatic on merge-requests) ─────────────────────────────
deploy:staging:
  stage: deploy
  image: alpine:3.19
  needs: [package:jar]
  environment:
    name: staging
    url: https://staging-api.talentpredict.example.com
  only:
    - merge_requests
  script:
    - echo ">>> Staging backend deploy placeholder"
