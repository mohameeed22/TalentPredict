<section class="interview-page">
  <header>
    <h2>Questions d'entretien</h2>
    <p>Generez une trame d'entretien a partir des points forts et points de vigilance du candidat.</p>
  </header>

  <div class="presets">
    <span>Profils rapides:</span>
    <button type="button" class="preset-btn" (click)="usePreset('backend')">Backend</button>
    <button type="button" class="preset-btn" (click)="usePreset('frontend')">Frontend</button>
    <button type="button" class="preset-btn" (click)="usePreset('data')">Data</button>
  </div>

  <div class="form-grid">
    <label>
      <span>Faiblesses ciblees</span>
      <input [(ngModel)]="weak" class="inp" placeholder="Ex: Docker, GraphQL" />
    </label>

    <label>
      <span>Forces detectees</span>
      <input [(ngModel)]="strong" class="inp" placeholder="Ex: JavaScript, Node.js" />
    </label>

    <label class="full-width">
      <span>Intitule du poste</span>
      <input [(ngModel)]="jobTitle" class="inp" placeholder="Ex: Full-Stack Developer" />
    </label>
  </div>

  <button type="button" class="generate-btn" (click)="generate()" [disabled]="loading">
    {{ loading ? 'Generation...' : 'Generer les questions' }}
  </button>

  <p class="err" *ngIf="error">{{ error }}</p>

  <section class="result-card" *ngIf="questions.length">
    <h3>Questions proposees</h3>
    <ol>
      <li *ngFor="let q of questions">{{ q }}</li>
    </ol>
  </section>
</section>
