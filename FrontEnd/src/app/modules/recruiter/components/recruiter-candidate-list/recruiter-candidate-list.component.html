<h1>Candidats</h1>
<p class="err" *ngIf="error">{{ error }}</p>
<table *ngIf="rows.length">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Score</th>
      <th>Fraude</th>
      <th>Profil public</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of rows">
      <td>{{ r.firstName }} {{ r.lastName }}</td>
      <td>{{ r.email }}</td>
      <td>{{ r.realScore ?? '—' }}</td>
      <td>{{ r.fraudRisk ?? '—' }}</td>
      <td>
        <a *ngIf="r.publicSlug" [href]="'/p/' + r.publicSlug" target="_blank" rel="noopener">/p/{{ r.publicSlug }}</a>
        <span *ngIf="!r.publicSlug">—</span>
      </td>
    </tr>
  </tbody>
</table>
