<div class="login-container">
  <div class="login-card">
    <h1>Connexion</h1>
    <p class="subtitle">Bienvenue sur TalentPredict</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="votre@email.com"
          required
        />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <span class="error">Email invalide</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          required
        />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <span class="error">Minimum 6 caractères</span>
        }
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-primary">
        @if (loading) {
          <span>Connexion...</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>
    </form>

    <p class="register-link">
      Pas encore de compte ?
      <a routerLink="/auth/register">S'inscrire</a>
    </p>
  </div>
</div>
