# ============================================================
# GitLab CI/CD — Frontend (Angular)
# ============================================================
# Child pipeline triggered from root .gitlab-ci.yml
# Stages: install → lint → build → test → docker → deploy
# ============================================================

stages:
  - install
  - lint
  - build
  - test
  - docker
  - deploy

# --------------------------------------------------
# Global settings
# --------------------------------------------------
variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  CONTAINER_NAME: "talentpredict-frontend"
  NODE_OPTIONS: "--max_old_space_size=4096"

# npm dependency cache
cache:
  key:
    files:
      - FrontEnd/package-lock.json
  paths:
    - FrontEnd/node_modules/
  policy: pull-push

# --------------------------------------------------
# Stage: install
# --------------------------------------------------
install:
  stage: install
  image: node:22-alpine
  script:
    - cd FrontEnd
    - npm ci --quiet

# --------------------------------------------------
# Stage: lint
# --------------------------------------------------
lint:
  stage: lint
  image: node:22-alpine
  script:
    - cd FrontEnd
    - npx ng lint

# --------------------------------------------------
# Stage: build
# --------------------------------------------------
build:
  stage: build
  image: node:22-alpine
  script:
    - cd FrontEnd
    - npx ng build --configuration production
  artifacts:
    paths:
      - FrontEnd/dist/
    expire_in: 1 day

# --------------------------------------------------
# Stage: test
# --------------------------------------------------
test:
  stage: test
  image: node:22-alpine
  script:
    - cd FrontEnd
    - npx vitest run

# --------------------------------------------------
# Stage: docker
# --------------------------------------------------
docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - cd FrontEnd
    - docker build
        --cache-from "$DOCKER_IMAGE:latest"
        -t "$DOCKER_IMAGE:$DOCKER_TAG"
        -t "$DOCKER_IMAGE:latest"
        .
    - docker push "$DOCKER_IMAGE:$DOCKER_TAG"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --------------------------------------------------
# Stage: deploy
# --------------------------------------------------
deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - echo "Stopping existing container if running..."
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - echo "Starting new container..."
    - docker pull "$DOCKER_IMAGE:$DOCKER_TAG"
    - docker run -d
        --name $CONTAINER_NAME
        --restart unless-stopped
        -p 4200:80
        "$DOCKER_IMAGE:$DOCKER_TAG"
    - echo "Frontend deployed on port 4200"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
    url: http://localhost:4200
