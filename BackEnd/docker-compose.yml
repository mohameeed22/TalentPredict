version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talent-predict-db
    environment:
      POSTGRES_DB: talent-predict-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talent-predict-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: talent-predict-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - talent-predict-network

networks:
  talent-predict-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

