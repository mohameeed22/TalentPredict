
server.port=8081
spring.application.name=TalentPredict

# ===================================================================
# Configuration PostgreSQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/talentpredict
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:11111111}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuration JPA/Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# Ensure schema.sql runs even on non-embedded databases (idempotent ALTERs)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===================================================================
# Configuration JWT
# ===================================================================
jwt.secret=${JWT_SECRET:TalentPredictSecretKeyForJWTAuthenticationMustBeLongEnough256Bits}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Frontend base URL (used for links in emails/SMS)
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# ===================================================================
# Login Security
# ===================================================================
security.login.max-failed-attempts=${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
security.login.lock-duration-minutes=${SECURITY_LOGIN_LOCK_DURATION_MINUTES:15}

# Refresh cookie security (set to true in production HTTPS)
security.cookie.secure=${SECURITY_COOKIE_SECURE:false}

