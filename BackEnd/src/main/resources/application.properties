# ---------------------------------------------------------------
#  Configuration LLM (Ollama local / OpenRouter cloud)
# ---------------------------------------------------------------
# Pour Ollama local:
#   openrouter.api.url=http://localhost:11434/v1/chat/completions
#   openrouter.model=llama3.1:8b
#   openrouter.apikey=ollama  (Ollama n'a pas besoin de clé, mais le champ ne doit pas etre vide)
#
# Pour OpenRouter cloud:
#   openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
#   openrouter.model=anthropic/claude-sonnet-4-5
#   openrouter.apikey=sk-or-v1-...
openrouter.apikey=ollama
openrouter.api.url=http://localhost:11434/v1/chat/completions
openrouter.model=llama3.1:8b

# ---------------------------------------------------------------
# GitHub API Token (optional, but recommended to avoid rate limiting)
# Without token: 60 requests/hour. With token: 5000 requests/hour.
# Generate at: https://github.com/settings/tokens (no scopes needed for public repos)
# ---------------------------------------------------------------
github.token=${GITHUB_TOKEN:}


# ---------------------------------------------------------------
# TalentPredict AI (Python) — optional; if set, orchestrator calls it for full analysis (GitHub + LinkedIn)
# ---------------------------------------------------------------
talentpredict.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}

# ---------------------------------------------------------------
#NOUVEAU : Configuration Async (pool de threads pour l'IA)
# ---------------------------------------------------------------
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=ai-analysis-
