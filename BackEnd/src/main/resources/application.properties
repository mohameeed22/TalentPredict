
server.port=8081
spring.application.name=TalentPredict

# ===================================================================
# Configuration PostgreSQL - LOCAL on your machine
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/talentpredict
spring.datasource.username=postgres
spring.datasource.password=11111111
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuration JPA/Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
# Keep false so schema.sql runs first; missing tables are then created by Hibernate (ddl-auto=update).
spring.jpa.defer-datasource-initialization=false

# Ensure schema.sql runs even on non-embedded databases (idempotent ALTERs)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===================================================================
# Configuration JWT
# ===================================================================
jwt.secret=TalentPredictSecretKeyForJWTAuthenticationMustBeLongEnough256Bits
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# Frontend base URL (used for links in emails/SMS)
frontend.base-url=http://localhost:4200

