
server.port=8081
spring.application.name=TalentPredict

# ===================================================================
# Configuration PostgreSQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/talentpredict
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:11111111}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuration JPA/Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ===================================================================
# Configuration JWT
# ===================================================================
jwt.secret=${JWT_SECRET:TalentPredictSecretKeyForJWTAuthenticationMustBeLongEnough256Bits}
jwt.expiration=86400000

# ===================================================================
# OpenAI
# ===================================================================
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4

# ===================================================================
# Jira Integration (disabled by default)
# ===================================================================
jira.url=${JIRA_URL:https://your-domain.atlassian.net}
jira.project.key=${JIRA_PROJECT_KEY:TRN}
jira.api.token=${JIRA_API_TOKEN:}
jira.enabled=false

# ===================================================================
# CORS
# ===================================================================
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# ===================================================================
# Configuration Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.talentpredict=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# Configuration Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Configuration Multipart (Upload de fichiers)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# CAMUNDA BPM - FULLY DISABLED
# No .bpmn processes implemented yet. Re-enable when needed.
# ===================================================================
camunda.bpm.enabled=false
camunda.bpm.auto-deployment-enabled=false
camunda.bpm.database.schema-update=false
camunda.bpm.process-engine-enabled=false

spring.autoconfigure.exclude=\
  org.camunda.bpm.spring.boot.starter.CamundaBpmAutoConfiguration,\
  org.camunda.bpm.spring.boot.starter.rest.CamundaBpmRestJerseyAutoConfiguration,\
  org.camunda.bpm.spring.boot.starter.actuator.CamundaBpmMonitoringAutoConfiguration

# ===================================================================
# TASK 3 — Mail (JavaMailSender) for password reset
# Set MAIL_USERNAME + MAIL_PASSWORD env vars on the server for real email.
# Without them, reset tokens are logged to the console instead.
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Do NOT fail startup if mail is unavailable
spring.mail.test-connection=false

