# ---------------------------------------------------------------
#  Configuration LLM (Ollama local / OpenRouter cloud)
# ---------------------------------------------------------------
# Pour Ollama local:
#   openrouter.api.url=http://localhost:11434/v1/chat/completions
#   openrouter.model=llama3.2:latest
#   openrouter.apikey=ollama  (Ollama n'a pas besoin de clé, mais le champ ne doit pas etre vide)
#
# Pour OpenRouter cloud:
#   openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
#   openrouter.model=anthropic/claude-sonnet-4-5
