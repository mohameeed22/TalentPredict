openrouter.model=${OPENROUTER_MODEL:llama3.2:latest}
openrouter.max-retries=${OPENROUTER_MAX_RETRIES:2}
openrouter.backoff-base-ms=${OPENROUTER_BACKOFF_BASE_MS:800}

