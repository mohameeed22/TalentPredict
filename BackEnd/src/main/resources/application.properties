
server.port=8081
spring.application.name=TalentPredict

# ===================================================================
# Configuration PostgreSQL - LOCAL on your machine
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentpredict}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:11111111}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuration JPA/Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ===================================================================
# Configuration JWT
# ===================================================================
jwt.secret=${JWT_SECRET:TalentPredictSecretKeyForJWTAuthenticationMustBeLongEnough256Bits}
jwt.expiration=86400000

# ===================================================================
# OpenAI
# ===================================================================
#openai.api.key=${OPENAI_API_KEY:}
#openai.model=gpt-4

# ===================================================================
# Jira Integration (disabled by default)
# ===================================================================
jira.url=${JIRA_URL:https://your-domain.atlassian.net}
jira.project.key=${JIRA_PROJECT_KEY:TRN}
jira.api.token=${JIRA_API_TOKEN:}
jira.enabled=false

# ===================================================================
# CORS
# ===================================================================
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost,http://localhost:80}

# ===================================================================
# n8n Soft Skills Agent Configuration
# ===================================================================
# For Docker environments, use the service name; for local, use localhost
n8n.base-url=${N8N_URL:http://localhost:5678}
n8n.webhook.soft-skills=/webhook/master-agent

# ===================================================================
# CV Extraction Service (NEW: Local Python service on port 9000)
# ===================================================================
cv.extractor.url=${CV_EXTRACTOR_URL:http://localhost:9000}
cv.extractor.endpoint=/extract

# ===================================================================
# Ollama LLM Configuration (used by n8n workflows)
# ===================================================================
ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ollama.model=llama3.2   

# ===================================================================
# Configuration Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.talentpredict=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# Configuration Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Configuration Multipart (Upload de fichiers)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# File Storage (photos, CVs uploaded locally)
# ===================================================================
file.upload-dir=uploads

# Application base URL (used to build full URLs for uploaded files)
app.base-url=http://localhost:8081

# ===================================================================
# CAMUNDA BPM - FULLY DISABLED
# No .bpmn processes implemented yet. Re-enable when needed.
# ===================================================================
camunda.bpm.enabled=false
camunda.bpm.auto-deployment-enabled=false
camunda.bpm.database.schema-update=false
camunda.bpm.process-engine-enabled=false

spring.autoconfigure.exclude=\
  org.camunda.bpm.spring.boot.starter.CamundaBpmAutoConfiguration,\
  org.camunda.bpm.spring.boot.starter.rest.CamundaBpmRestJerseyAutoConfiguration,\
  org.camunda.bpm.spring.boot.starter.actuator.CamundaBpmMonitoringAutoConfiguration

# ===================================================================
# TASK 3 — Mail (JavaMailSender) for password reset
# Set MAIL_USERNAME + MAIL_PASSWORD env vars on the server for real email.
# Without them, reset tokens are logged to the console instead.
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Do NOT fail startup if mail is unavailable
spring.mail.test-connection=false

# ---------------------------------------------------------------
#  Configuration LLM (Ollama local / OpenRouter cloud)
# ---------------------------------------------------------------
# Pour Ollama local:
#   openrouter.api.url=http://localhost:11434/v1/chat/completions
#   openrouter.model=llama3.1:8b
#   openrouter.apikey=ollama  (Ollama n'a pas besoin de clé, mais le champ ne doit pas etre vide)
#
# Pour OpenRouter cloud:
#   openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
#   openrouter.model=anthropic/claude-sonnet-4-5
#   openrouter.apikey=sk-or-v1-...
openrouter.apikey=ollama
openrouter.api.url=http://localhost:11434/v1/chat/completions
openrouter.model=llama3.1:8b

# ---------------------------------------------------------------
# GitHub API Token (optional, but recommended to avoid rate limiting)
# Without token: 60 requests/hour. With token: 5000 requests/hour.
# Generate at: https://github.com/settings/tokens (no scopes needed for public repos)
# ---------------------------------------------------------------
github.token=${GITHUB_TOKEN:}


# ---------------------------------------------------------------
# TalentPredict AI (Python) — optional; if set, orchestrator calls it for full analysis (GitHub + LinkedIn)
# ---------------------------------------------------------------
talentpredict.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}

# ---------------------------------------------------------------
#NOUVEAU : Configuration Async (pool de threads pour l'IA)
# ---------------------------------------------------------------
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=ai-analysis-
