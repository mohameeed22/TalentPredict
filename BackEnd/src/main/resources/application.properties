
server.port=8081
spring.application.name=TalentPredict

# ===================================================================
# Configuration PostgreSQL (Local)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/talentpredict
spring.datasource.username=postgres
spring.datasource.password=11111111
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuration JPA/Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================================
# Configuration JWT
# ===================================================================
jwt.secret=TalentPredictSecretKeyForJWTAuthenticationMustBeLongEnough256Bits
jwt.expiration=86400000




# ===================================================================
# Configuration Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.talentpredict=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# Configuration Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Configuration Multipart (Upload de fichiers)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Camunda servlet path (avoid conflicts with Spring MVC)
# ===================================================================
camunda.bpm.webapp.application-path=/camunda

# ===================================================================
# Disable open-in-view warning
# ===================================================================
spring.jpa.open-in-view=false
