# Test profile configuration
spring.profiles.active=test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate config for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT config for tests
jwt.secret=TestSecretKeyForJWTAuthenticationMustBeLongEnough256BitsForTests
jwt.expiration=86400000

# Disable actuator endpoints in tests
management.endpoints.enabled-by-default=false

# Logging - reduce noise in tests
logging.level.root=WARN
logging.level.com.talentpredict=INFO
