# =============================================================
# Profil de test — remplace toutes les propriétés de l'env réel
# Aucune connexion réseau externe n'est requise dans ce profil.
# =============================================================
spring.profiles.active=test

# ── Base de données H2 en mémoire ────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# Désactiver l'init SQL (schema.sql utilise du SQL PostgreSQL spécifique)
spring.sql.init.mode=never

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=TestSecretKeyForJWTAuthenticationMustBeLongEnough256BitsForTests
jwt.expiration=86400000
jwt.access-token.expiration=43200000
jwt.refresh-token.expiration=604800000

# ── Mail (désactivé — JavaMailSender non instancié) ──────────
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@talentpredict.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=false
# Spring Boot auto-configure JavaMailSender seulement si host est défini ;
# on garde la valeur mais on override required=false via @Autowired(required=false)

# ── Twilio (SMS désactivé dans les tests) ────────────────────
twilio.account-sid=
twilio.auth-token=
twilio.from-number=+10000000000
twilio.whatsapp-from=
twilio.whatsapp-number=

# ── OAuth2 (désactivé — stubs sans vraies credentials) ───────
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=user:email

# ── GitHub API ────────────────────────────────────────────────
github.token=test-token

# ── AI / LLM / Microservices ─────────────────────────────────
talentpredict.ai.base-url=http://localhost:8000
talentpredict.ai.api-key=test-api-key
talentpredict.ai.request-timeout-seconds=5
openrouter.apikey=test
openrouter.api.url=http://localhost:11434/v1/chat/completions
openrouter.model=test-model
openrouter.max-retries=1
openrouter.backoff-base-ms=0
ollama.base-url=http://localhost:11434
ollama.model=test
n8n.base-url=http://localhost:5678
n8n.webhook.soft-skills=/webhook/master-agent
cv.extractor.url=http://localhost:9000
cv.extractor.endpoint=/extract

# ── Resilience4j ─────────────────────────────────────────────
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=1s
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.aiService.timeout-duration=5s
resilience4j.timelimiter.instances.aiService.cancel-running-future=true
resilience4j.retry.instances.aiService.max-attempts=1
resilience4j.retry.instances.aiService.wait-duration=1s

# ── Sécurité ─────────────────────────────────────────────────
security.cookie.secure=false
security.login.max-failed-attempts=5
security.login.lock-duration-minutes=15
auth.email-verification.expiration-minutes=1440
auth.two-factor.code-expiration-minutes=10
frontend.base-url=http://localhost:4200
allowed.origins=http://localhost:4200

# ── Divers ───────────────────────────────────────────────────
file.upload-dir=uploads-test
app.base-url=http://localhost:8081
app.name=TalentPredict
http.client.connect-timeout-ms=1000
http.client.read-timeout-ms=5000
scheduler.softskills.enabled=false
scheduler.softskills.inactive-days-reminder=30
scheduler.softskills.inactive-days-reevaluation=90
scheduler.softskills.cron=0 0 9 * * MON-FRI

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.enabled-by-default=false

# ── Logging ──────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.talentpredict=INFO
logging.level.org.springframework.security=WARN

