# ============================================================
# GitLab CI/CD — Backend (Spring Boot)
# ============================================================
# Child pipeline triggered from root .gitlab-ci.yml
# Stages: validate → build → test → quality → package → docker → deploy
# ============================================================

stages:
  - validate
  - build
  - test
  - quality
  - package
  - docker
  - deploy

# --------------------------------------------------
# Global settings
# --------------------------------------------------
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/BackEnd/.m2/repository"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  CONTAINER_NAME: "talentpredict-backend"
  POSTGRES_DB: talentpredict_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

# Maven dependency cache
cache:
  key:
    files:
      - BackEnd/pom.xml
  paths:
    - BackEnd/.m2/repository/
  policy: pull-push

# --------------------------------------------------
# Stage: validate
# --------------------------------------------------
validate:
  stage: validate
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd BackEnd
    - mvn -B -q clean validate

# --------------------------------------------------
# Stage: build
# --------------------------------------------------
build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd BackEnd
    - mvn clean compile -B

# --------------------------------------------------
# Stage: test
# --------------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/$POSTGRES_DB"
    SPRING_DATASOURCE_USERNAME: "$POSTGRES_USER"
    SPRING_DATASOURCE_PASSWORD: "$POSTGRES_PASSWORD"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
  script:
    - cd BackEnd
    - mvn test -B
  artifacts:
    when: always
    reports:
      junit: BackEnd/target/surefire-reports/TEST-*.xml
    expire_in: 7 days

# --------------------------------------------------
# Stage: quality
# --------------------------------------------------
quality:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd BackEnd
    - mvn checkstyle:check -B
  allow_failure: true

# --------------------------------------------------
# Stage: package
# --------------------------------------------------
package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd BackEnd
    - mvn package -DskipTests -B
  artifacts:
    paths:
      - BackEnd/target/*.jar
    expire_in: 1 day

# --------------------------------------------------
# Stage: docker
# --------------------------------------------------
docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - cd BackEnd
    - docker build
        --cache-from "$DOCKER_IMAGE:latest"
        -t "$DOCKER_IMAGE:$DOCKER_TAG"
        -t "$DOCKER_IMAGE:latest"
        .
    - docker push "$DOCKER_IMAGE:$DOCKER_TAG"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --------------------------------------------------
# Stage: deploy
# --------------------------------------------------
deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - echo "Stopping existing container if running..."
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - echo "Starting new container..."
    - docker pull "$DOCKER_IMAGE:$DOCKER_TAG"
    - docker run -d
        --name $CONTAINER_NAME
        --restart unless-stopped
        -p 8081:8081
        "$DOCKER_IMAGE:$DOCKER_TAG"
    - echo "Backend deployed on port 8081"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
    url: http://localhost:8081
