# ============================================
# TalentPredict - Staging Docker Compose
# Usage: docker-compose -f docker-compose.staging.yml up -d
# ============================================

version: '3.8'

services:
  # ---- PostgreSQL Database ----
  postgres-staging:
    image: postgres:16-alpine
    container_name: talentpredict-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentpredict_staging
      POSTGRES_USER: ${STAGING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - talentpredict-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentpredict_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---- Backend Service (Spring Boot) ----
  backend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/talentpredict}/backend:${BACKEND_TAG:-latest}
    container_name: talentpredict-backend-staging
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-staging:5432/talentpredict_staging
      SPRING_DATASOURCE_USERNAME: ${STAGING_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${STAGING_DB_PASSWORD}
      JWT_SECRET: ${STAGING_JWT_SECRET}
      SERVER_PORT: "8081"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "8081:8081"
    networks:
      - talentpredict-staging
    depends_on:
      postgres-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Frontend Service (Nginx) ----
  frontend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/talentpredict}/frontend:${FRONTEND_TAG:-latest}
    container_name: talentpredict-frontend-staging
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - talentpredict-staging
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  talentpredict-staging:
    driver: bridge
    name: talentpredict-staging

volumes:
  postgres_staging_data:
    name: talentpredict-postgres-staging-data
