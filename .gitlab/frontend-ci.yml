# ================================================================
#  TalentPredict — Frontend Pipeline
#  Angular 21 · Node 22 · Vitest · Nginx
# ================================================================
#
#  Trigger: runs ONLY when files under FrontEnd/ change.
#
#  Job DAG:
#    install ──┬── build ─────── package ──┬── deploy:dev
#              ├── test                    ├── deploy:staging
#              ├── quality                 ├── deploy:production (manual)
#              └── security               └── rollback:production (manual)
#
# ================================================================


# ╔══════════════════════════════════════════════════════════════════╗
# ║  TEMPLATES                                                      ║
# ╚══════════════════════════════════════════════════════════════════╝

# ------------------------------------------------------------------
#  Base template — all frontend jobs extend this
#
#  Cache includes both node_modules (for fast installs) and the
#  global npm cache (.npm/) for offline-first behaviour.
#
#  NOTE: We inline cache/rules in the base job instead of using
#  YAML merge keys (<<:) — multiple merge keys silently overwrite.
# ------------------------------------------------------------------
.frontend_base:
  image: node:22-alpine
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - FrontEnd/node_modules/
      - .npm/
    policy: pull-push
  rules:
    - changes:
        - FrontEnd/**/*
      when: on_success
    - when: never
  before_script:
    - cd FrontEnd


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 1 — INSTALL                                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Install npm dependencies using `npm ci` for deterministic builds.
# --legacy-peer-deps handles Angular peer dependency conflicts.
# --prefer-offline uses the npm cache first before hitting registry.
# ------------------------------------------------------------------
frontend:install:
  extends: .frontend_base
  stage: install
  script:
    - echo "════ Installing npm dependencies ════"
    - npm ci --legacy-peer-deps --prefer-offline
  artifacts:
    paths:
      - FrontEnd/node_modules/
    expire_in: 1 day


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 2 — BUILD                                                ║
# ╚══════════════════════════════════════════════════════════════════╝
# Build the Angular application for production. The output goes to
# FrontEnd/dist/ which is used by the Dockerfile and package stage.
# ------------------------------------------------------------------
frontend:build:
  extends: .frontend_base
  stage: build
  needs: ["frontend:install"]
  script:
    - echo "════ Building production bundle ════"
    - npm run build -- --configuration production
  artifacts:
    paths:
      - FrontEnd/dist/
    expire_in: 1 day


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 3 — TEST                                                 ║
# ╚══════════════════════════════════════════════════════════════════╝
# Run unit tests with Vitest (configured in package.json).
# JUnit XML output is collected by GitLab for the MR test widget.
# ------------------------------------------------------------------
frontend:test:
  extends: .frontend_base
  stage: test
  needs: ["frontend:install"]
  script:
    - echo "════ Running unit tests (Vitest) ════"
    - npx vitest run --reporter=junit --outputFile=test-results.xml || true
  artifacts:
    when: always
    reports:
      junit:
        - FrontEnd/test-results.xml
    expire_in: 7 days


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 4 — QUALITY                                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Run ESLint via Angular CLI and TypeScript type-checking.
# Both are non-blocking (allow_failure) to avoid breaking the
# pipeline while linting rules are being established.
# ------------------------------------------------------------------
frontend:quality:
  extends: .frontend_base
  stage: quality
  needs: ["frontend:install"]
  script:
    - echo "════ Running lint & type-checking ════"
    # Angular lint (requires @angular-eslint to be configured)
    - npx ng lint --force || echo "⚠ Lint not configured — add @angular-eslint for full linting"
    # TypeScript strict type-checking (catches type errors without emitting)
    - npx tsc --noEmit || true
  allow_failure: true


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 5 — SECURITY                                             ║
# ╚══════════════════════════════════════════════════════════════════╝
# Audit npm dependencies for known vulnerabilities.
# Only checks production dependencies (--omit=dev) at high+ severity.
# ------------------------------------------------------------------
frontend:security:
  extends: .frontend_base
  stage: security
  needs: ["frontend:install"]
  script:
    - echo "════ Auditing npm dependencies ════"
    - npm audit --audit-level=high --omit=dev 2>&1 | tee npm-audit-report.txt || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - FrontEnd/npm-audit-report.txt
    expire_in: 30 days


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 6 — PACKAGE                                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Build the production Docker image (multi-stage: Node build → Nginx)
# and push to GitLab Container Registry.
#
# Image tags:
#   • $CI_COMMIT_SHORT_SHA  — immutable, for deployment traceability
#   • $CI_COMMIT_REF_SLUG   — branch/tag name, human-readable
#   • latest                — used as cache source for next build
# ------------------------------------------------------------------
frontend:package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:build", "frontend:test"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "════ Building Docker image for frontend ════"
    - cd FrontEnd
    - >
      docker build
      --pull
      --cache-from "$FRONTEND_IMAGE:latest"
      --tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --tag "$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG"
      --tag "$FRONTEND_IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      .
    - echo "════ Pushing image to registry ════"
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      changes:
        - FrontEnd/**/*
      when: on_success
    - when: never


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 7 — DEPLOY                                               ║
# ╚══════════════════════════════════════════════════════════════════╝


# ──────────────────────────────────────────────────────────────────
#  DEVELOPMENT — auto-deploy on `develop` branch
# ──────────────────────────────────────────────────────────────────
frontend:deploy:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:package"]
  environment:
    name: development
    url: https://dev.talentpredict.local
    on_stop: frontend:stop:dev
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ Deploying Frontend to DEVELOPMENT ═══"
    - docker pull "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker stop talentpredict-frontend-dev 2>/dev/null || true
    - docker rm   talentpredict-frontend-dev 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-frontend-dev
      --restart unless-stopped
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-dev:${BACKEND_PORT}"
      "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Verify the container is serving traffic
    - sleep 5
    - >
      wget --no-verbose --tries=3 --retry-connrefused
      --spider "http://localhost:${FRONTEND_PORT}/"
      && echo "✅ Health check passed"
      || echo "⚠️  Health check failed — container may still be starting"
    - echo "✅ Frontend development deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - FrontEnd/**/*
      when: on_success
    - when: never

# Stop job for development environment
frontend:stop:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: development
    action: stop
  script:
    - docker stop talentpredict-frontend-dev 2>/dev/null || true
    - docker rm   talentpredict-frontend-dev 2>/dev/null || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
    - when: never


# ──────────────────────────────────────────────────────────────────
#  STAGING — auto-deploy on `main` branch
# ──────────────────────────────────────────────────────────────────
frontend:deploy:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:package"]
  environment:
    name: staging
    url: https://staging.talentpredict.local
    on_stop: frontend:stop:staging
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ Deploying Frontend to STAGING ═══"
    - docker pull "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker stop talentpredict-frontend-staging 2>/dev/null || true
    - docker rm   talentpredict-frontend-staging 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-frontend-staging
      --restart unless-stopped
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-staging:${BACKEND_PORT}"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - >
      wget --no-verbose --tries=3 --retry-connrefused
      --spider "http://localhost:${FRONTEND_PORT}/"
      && echo "✅ Health check passed"
      || echo "⚠️  Health check failed — container may still be starting"
    - echo "✅ Frontend staging deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - FrontEnd/**/*
      when: on_success
    - when: never

# Stop job for staging environment
frontend:stop:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: staging
    action: stop
  script:
    - docker stop talentpredict-frontend-staging 2>/dev/null || true
    - docker rm   talentpredict-frontend-staging 2>/dev/null || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never


# ──────────────────────────────────────────────────────────────────
#  PRODUCTION — manual deploy on semantic version tags (v*.*.*)
# ──────────────────────────────────────────────────────────────────
frontend:deploy:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["frontend:package"]
  environment:
    name: production
    url: https://talentpredict.com
    on_stop: frontend:stop:production
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ Deploying Frontend to PRODUCTION ═══"
    - docker pull "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Save current production image as :rollback before replacing
    - >
      docker tag "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE:rollback" 2>/dev/null
      && docker push "$FRONTEND_IMAGE:rollback"
      || echo "ℹ️  No previous image to tag as rollback"
    - docker stop talentpredict-frontend-prod 2>/dev/null || true
    - docker rm   talentpredict-frontend-prod 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-frontend-prod
      --restart unless-stopped
      --memory=256m
      --memory-reservation=128m
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-prod:${BACKEND_PORT}"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - >
      wget --no-verbose --tries=5 --retry-connrefused
      --spider "http://localhost:${FRONTEND_PORT}/"
      && echo "✅ Production health check passed"
      || (echo "❌ Health check FAILED — consider rollback" && exit 1)
    - echo "✅ Frontend production deployment complete"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: false
    - when: never

# Stop job for production environment
frontend:stop:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    action: stop
  script:
    - docker stop talentpredict-frontend-prod 2>/dev/null || true
    - docker rm   talentpredict-frontend-prod 2>/dev/null || true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
    - when: never


# ──────────────────────────────────────────────────────────────────
#  ROLLBACK — manually re-deploy the previous production image
# ──────────────────────────────────────────────────────────────────
frontend:rollback:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    url: https://talentpredict.com
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ ROLLING BACK Frontend to previous version ═══"
    - docker pull "$FRONTEND_IMAGE:rollback"
    - docker stop talentpredict-frontend-prod 2>/dev/null || true
    - docker rm   talentpredict-frontend-prod 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-frontend-prod
      --restart unless-stopped
      --memory=256m
      --memory-reservation=128m
      -p "${FRONTEND_PORT}:80"
      -e NGINX_BACKEND_URL="http://talentpredict-backend-prod:${BACKEND_PORT}"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$FRONTEND_IMAGE:rollback"
    - sleep 5
    - >
      wget --no-verbose --tries=5 --retry-connrefused
      --spider "http://localhost:${FRONTEND_PORT}/"
      && echo "✅ Rollback health check passed"
      || (echo "❌ Rollback health check FAILED" && exit 1)
    - echo "✅ Frontend production ROLLBACK complete"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
    - when: never
