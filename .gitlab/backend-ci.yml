# ================================================================
#  TalentPredict — Backend Pipeline
#  Spring Boot 3.4 · Java 21 · Maven · Docker
# ================================================================
#
#  Trigger: runs ONLY when files under BackEnd/ change.
#
#  Job DAG:
#    build ──┬── test ──────── package ──┬── deploy:dev
#            ├── quality                 ├── deploy:staging
#            └── security               ├── deploy:production (manual)
#                                       └── rollback:production (manual)
#
# ================================================================


# ╔══════════════════════════════════════════════════════════════════╗
# ║  ANCHORS & TEMPLATES                                            ║
# ╚══════════════════════════════════════════════════════════════════╝

# ------------------------------------------------------------------
#  Maven dependency cache — keyed per branch for isolation
# ------------------------------------------------------------------
.backend_cache:
  cache:
    key: "backend-maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository/
    policy: pull-push

# ------------------------------------------------------------------
#  Change-detection rules — only trigger on BackEnd/ file changes
# ------------------------------------------------------------------
.backend_rules:
  rules:
    - changes:
        - BackEnd/**/*
      when: on_success
    - when: never

# ------------------------------------------------------------------
#  Base template — all backend jobs extend this
#
#  NOTE: We use `extends` + explicit cache/rules instead of YAML
#  merge keys (<<:) because multiple merge keys silently overwrite
#  each other — only the last one takes effect.
# ------------------------------------------------------------------
.backend_base:
  image: maven:3.9.9-eclipse-temurin-21-alpine
  cache:
    key: "backend-maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository/
    policy: pull-push
  rules:
    - changes:
        - BackEnd/**/*
      when: on_success
    - when: never
  before_script:
    - cd BackEnd


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 1 — BUILD                                                ║
# ╚══════════════════════════════════════════════════════════════════╝
# Compile the Maven project and produce target/ artifacts for
# downstream jobs so they don't need to recompile.
# ------------------------------------------------------------------
backend:build:
  extends: .backend_base
  stage: build
  script:
    - echo "════ Compiling Spring Boot application ════"
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - BackEnd/target/
    expire_in: 1 day


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 2 — TEST                                                 ║
# ╚══════════════════════════════════════════════════════════════════╝
# Run all unit tests with Surefire. JUnit XML reports are collected
# by GitLab for the Merge Request test summary widget.
# ------------------------------------------------------------------
backend:test:
  extends: .backend_base
  stage: test
  needs: ["backend:build"]
  script:
    - echo "════ Running unit & integration tests ════"
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    paths:
      - BackEnd/target/surefire-reports/
    reports:
      junit:
        - BackEnd/target/surefire-reports/TEST-*.xml
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%/'


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 3 — QUALITY                                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Run static code analysis (Checkstyle, SpotBugs, PMD — whatever is
# configured in the pom.xml <reporting> section) via `mvn verify`.
# Tests are skipped here since they already ran in the test stage.
# ------------------------------------------------------------------
backend:quality:
  extends: .backend_base
  stage: quality
  needs: ["backend:build"]
  script:
    - echo "════ Running static code analysis ════"
    - mvn $MAVEN_CLI_OPTS verify -DskipTests
  allow_failure: true          # Non-blocking — fix warnings iteratively
  artifacts:
    paths:
      - BackEnd/target/site/
    expire_in: 7 days


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 4 — SECURITY                                             ║
# ╚══════════════════════════════════════════════════════════════════╝
# Scan all Maven dependencies for known CVEs using OWASP
# dependency-check. Fails the build only for CVSS ≥ 8 (critical).
# The full HTML report is stored as a pipeline artifact.
# ------------------------------------------------------------------
backend:security:
  extends: .backend_base
  stage: security
  needs: ["backend:build"]
  script:
    - echo "════ Scanning dependencies for vulnerabilities (OWASP) ════"
    - >
      mvn $MAVEN_CLI_OPTS
      org.owasp:dependency-check-maven:check
      -DfailBuildOnCVSS=8
      -DsuppressionFile=owasp-suppressions.xml
      || true
  allow_failure: true          # Advisory — don't block deploys
  artifacts:
    when: always
    paths:
      - BackEnd/target/dependency-check-report.html
    expire_in: 30 days


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 5 — PACKAGE                                              ║
# ╚══════════════════════════════════════════════════════════════════╝
# Build the production Docker image and push it to GitLab Container
# Registry. Uses:
#   • Multi-stage Dockerfile     → small runtime image
#   • BuildKit inline cache      → faster rebuilds
#   • --cache-from :latest       → reuse layers from previous build
#   • Three tags: SHA, branch/tag slug, latest
#
# Only runs on deployable branches (develop, main) or version tags.
# ------------------------------------------------------------------
backend:package:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:test"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "════ Building Docker image for backend ════"
    - cd BackEnd
    - >
      docker build
      --pull
      --cache-from "$BACKEND_IMAGE:latest"
      --tag "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --tag "$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG"
      --tag "$BACKEND_IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      .
    - echo "════ Pushing image to registry ════"
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      changes:
        - BackEnd/**/*
      when: on_success
    - when: never


# ╔══════════════════════════════════════════════════════════════════╗
# ║  STAGE 6 — DEPLOY                                               ║
# ╚══════════════════════════════════════════════════════════════════╝


# ──────────────────────────────────────────────────────────────────
#  DEVELOPMENT — auto-deploy on `develop` branch
# ──────────────────────────────────────────────────────────────────
backend:deploy:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:package"]
  environment:
    name: development
    url: https://dev.talentpredict.local
    on_stop: backend:stop:dev
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ Deploying Backend to DEVELOPMENT ═══"
    - docker pull "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Stop & remove any existing container gracefully
    - docker stop talentpredict-backend-dev 2>/dev/null || true
    - docker rm   talentpredict-backend-dev 2>/dev/null || true
    # Launch new container with dev environment variables
    - >
      docker run -d
      --name talentpredict-backend-dev
      --restart unless-stopped
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=development
      -e SPRING_DATASOURCE_URL="${DEV_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${DEV_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${DEV_DB_PASSWORD}"
      -e JWT_SECRET="${DEV_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Wait for application startup, then verify health
    - sleep 15
    - >
      wget --no-verbose --tries=3 --retry-connrefused
      --spider "http://localhost:${BACKEND_PORT}/actuator/health"
      && echo "✅ Health check passed"
      || echo "⚠️  Health check failed — container may still be starting"
    - echo "✅ Backend development deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - BackEnd/**/*
      when: on_success
    - when: never

# Stop job for development environment
backend:stop:dev:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: development
    action: stop
  script:
    - docker stop talentpredict-backend-dev 2>/dev/null || true
    - docker rm   talentpredict-backend-dev 2>/dev/null || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
    - when: never


# ──────────────────────────────────────────────────────────────────
#  STAGING — auto-deploy on `main` branch
# ──────────────────────────────────────────────────────────────────
backend:deploy:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:package"]
  environment:
    name: staging
    url: https://staging.talentpredict.local
    on_stop: backend:stop:staging
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ Deploying Backend to STAGING ═══"
    - docker pull "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker stop talentpredict-backend-staging 2>/dev/null || true
    - docker rm   talentpredict-backend-staging 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-backend-staging
      --restart unless-stopped
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=staging
      -e SPRING_DATASOURCE_URL="${STAGING_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${STAGING_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${STAGING_DB_PASSWORD}"
      -e JWT_SECRET="${STAGING_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      -e JAVA_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 15
    - >
      wget --no-verbose --tries=3 --retry-connrefused
      --spider "http://localhost:${BACKEND_PORT}/actuator/health"
      && echo "✅ Health check passed"
      || echo "⚠️  Health check failed — container may still be starting"
    - echo "✅ Backend staging deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - BackEnd/**/*
      when: on_success
    - when: never

# Stop job for staging environment
backend:stop:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: staging
    action: stop
  script:
    - docker stop talentpredict-backend-staging 2>/dev/null || true
    - docker rm   talentpredict-backend-staging 2>/dev/null || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never


# ──────────────────────────────────────────────────────────────────
#  PRODUCTION — manual deploy on semantic version tags (v*.*.*)
# ──────────────────────────────────────────────────────────────────
backend:deploy:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["backend:package"]
  environment:
    name: production
    url: https://talentpredict.com
    on_stop: backend:stop:production
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ Deploying Backend to PRODUCTION ═══"
    - docker pull "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Save current production image as :rollback before replacing
    - >
      docker tag "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:rollback" 2>/dev/null
      && docker push "$BACKEND_IMAGE:rollback"
      || echo "ℹ️  No previous image to tag as rollback"
    - docker stop talentpredict-backend-prod 2>/dev/null || true
    - docker rm   talentpredict-backend-prod 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-backend-prod
      --restart unless-stopped
      --memory=1g
      --memory-reservation=512m
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=production
      -e SPRING_DATASOURCE_URL="${PROD_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${PROD_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${PROD_DB_PASSWORD}"
      -e JWT_SECRET="${PROD_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      -e JAVA_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 20
    - >
      wget --no-verbose --tries=5 --retry-connrefused
      --spider "http://localhost:${BACKEND_PORT}/actuator/health"
      && echo "✅ Production health check passed"
      || (echo "❌ Health check FAILED — consider rollback" && exit 1)
    - echo "✅ Backend production deployment complete"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: false
    - when: never

# Stop job for production environment
backend:stop:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    action: stop
  script:
    - docker stop talentpredict-backend-prod 2>/dev/null || true
    - docker rm   talentpredict-backend-prod 2>/dev/null || true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
    - when: never


# ──────────────────────────────────────────────────────────────────
#  ROLLBACK — manually re-deploy the previous production image
# ──────────────────────────────────────────────────────────────────
backend:rollback:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  environment:
    name: production
    url: https://talentpredict.com
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "═══ ROLLING BACK Backend to previous version ═══"
    - docker pull "$BACKEND_IMAGE:rollback"
    - docker stop talentpredict-backend-prod 2>/dev/null || true
    - docker rm   talentpredict-backend-prod 2>/dev/null || true
    - >
      docker run -d
      --name talentpredict-backend-prod
      --restart unless-stopped
      --memory=1g
      --memory-reservation=512m
      -p "${BACKEND_PORT}:${BACKEND_PORT}"
      -e SPRING_PROFILES_ACTIVE=production
      -e SPRING_DATASOURCE_URL="${PROD_DB_URL}"
      -e SPRING_DATASOURCE_USERNAME="${PROD_DB_USER}"
      -e SPRING_DATASOURCE_PASSWORD="${PROD_DB_PASSWORD}"
      -e JWT_SECRET="${PROD_JWT_SECRET}"
      -e SERVER_PORT="${BACKEND_PORT}"
      -e JAVA_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      --log-driver json-file
      --log-opt max-size=10m
      --log-opt max-file=5
      "$BACKEND_IMAGE:rollback"
    - sleep 20
    - >
      wget --no-verbose --tries=5 --retry-connrefused
      --spider "http://localhost:${BACKEND_PORT}/actuator/health"
      && echo "✅ Rollback health check passed"
      || (echo "❌ Rollback health check FAILED" && exit 1)
    - echo "✅ Backend production ROLLBACK complete"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
    - when: never
